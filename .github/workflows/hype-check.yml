name: Fast check during hype windows

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pokemon-tracker-run
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Determine if a hype window is active
        id: hype
        run: echo "active=$(python3 check_hype_window.py)" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.hype.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.hype.outputs.active == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        if: steps.hype.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: python main.py

      - name: Commit updated state
        if: steps.hype.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            python merge_state.py
            git add seen_products.json coolshit_coming_soon_state.json coolshit_status_state.json celebrationbox_seen_state.json status.json release_history.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Update seen products state (hype window)"
            git merge -X ours origin/main --no-edit || true
            if git push; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed on attempt $i, retrying..."
            sleep 5
          done
